name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.5'
      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        id: pnpm-audit
        working-directory: frontend
        shell: bash
        run: |
          # Exit 1 can mean findings or an operational failure; classify the JSON below.
          set +e
          pnpm audit --prod --audit-level=high --json > audit.json
          audit_exit_code=$?
          set -e
          printf 'exit_code=%s\n' "$audit_exit_code" >> "$GITHUB_OUTPUT"
          if [ ! -s audit.json ]; then
            echo "pnpm audit did not produce a JSON report" >&2
            exit 1
          fi
      - name: Validate pnpm audit response
        env:
          AUDIT_EXIT_CODE: ${{ steps.pnpm-audit.outputs.exit_code }}
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --audit-exit-code "$AUDIT_EXIT_CODE" \
            --validate-only
      - name: Check audit exceptions
        env:
          AUDIT_EXIT_CODE: ${{ steps.pnpm-audit.outputs.exit_code }}
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml \
            --audit-exit-code "$AUDIT_EXIT_CODE"

  # Fail fast if any workflow interpolates user-/step-controlled ${{ ... }}
  # expressions directly inside a `run:` block (H-4 regression guard).
  workflow-injection-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: "Scan workflows for run: expression injection"
        run: |
          python -m pip install --quiet pyyaml
          python tools/check_workflow_injection.py
